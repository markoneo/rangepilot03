[build]
  command = "npx expo export --platform web --output-dir dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # EXPO_PUBLIC_* values are meant to be in the browser bundle (public,
  # referrer-restricted keys) — don't let secret scanning fail the build.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_SUPABASE_URL,EXPO_PUBLIC_SUPABASE_ANON_KEY,EXPO_PUBLIC_GOOGLE_MAPS_KEY"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Single-page app: send every route to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
